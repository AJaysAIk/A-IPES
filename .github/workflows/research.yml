name: A-IPES research
on:
  push:
    paths: ['src/**', 'scripts/**', 'tests/**', 'pyproject.toml', 'results/benchmark_v2_30/per_benchmark.csv', '.github/workflows/research.yml']
  pull_request:
    paths: ['src/**', 'scripts/**', 'tests/**', 'pyproject.toml', 'results/benchmark_v2_30/per_benchmark.csv', '.github/workflows/research.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e '.[dev]'
      - run: python -m pip check
      - run: python scripts/check_research_environment.py
      - run: python -m pytest -q
      - name: Record resolved dependencies
        if: always()
        run: python -m pip freeze > resolved-dependencies.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: research-environment-py${{ matrix.python-version }}
          path: resolved-dependencies.txt
